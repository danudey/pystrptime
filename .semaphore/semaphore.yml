  - name: "🛡️Security Checks"
    dependencies:
      - "📦 Setup Dependencies"
    task:
      jobs:
        - name: "🛡️ Bandit scan"
          commands:
            - echo "Running Bandit security scan…"
            - 'export PATH="$HOME/.local/bin:$PATH"'
            - mkdir -p .pip_cache
            - cache restore
            - 'pip install --user bandit'
            - bandit -r . -ll

after_pipeline:
  task:
    jobs:
      - name: "📊 Merge reports"
        commands:
          - test-results gen-pipeline-report  # Consolidate all JUnit XMLs
