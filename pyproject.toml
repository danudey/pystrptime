[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "strptime"
version = "1.0"
description = "Parse a string in C"
requires-python = ">=3.10"

[tool.setuptools]
include-package-data = false
ext-modules = [
    {name = "strptime", sources = ["src/strptime.c"]}
]
